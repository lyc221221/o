<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜馬拉雅山「雪嶺鎮」- 2D 動態小鎮模擬器</title>
    <style>
        body { font-family: sans-serif; background: #1a2634; color: #ecf0f1; margin: 0; padding: 15px; text-align: center; }
        .main-layout { display: flex; justify-content: center; gap: 15px; max-width: 1200px; margin: 0 auto; }
        canvas { border: 3px solid #f1c40f; border-radius: 8px; background: #cce7e8; cursor: pointer; image-rendering: pixelated; }
        .sidebar { background: #243342; border-radius: 8px; padding: 15px; width: 300px; text-align: left; }
        .status-box { background: #1e2b37; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 4px solid #e74c3c; font-size: 13px; }
        .coordinate { color: #f1c40f; font-family: monospace; font-size: 16px; }
        @media (max-width: 850px) { .main-layout { flex-direction: column; align-items: center; } .sidebar { width: min(300px, calc(100% - 30px)); } canvas { max-width: 100%; height: auto; } }
    </style>
</head>
<body>
    <h2>🏔️ 喜馬拉雅山「雪嶺鎮」- 100 位居民動態地圖</h2>
    <p>⏰ 模擬時間：<span id="game-time" style="color:#f1c40f;">08:00 AM</span> | 點擊彩色小人可查看該 Agent 動態</p>

    <div class="main-layout">
        <canvas id="townMap" width="700" height="500"></canvas>
        <div class="sidebar" id="sidebar">
            <h3>👤 請點擊地圖上的小人</h3>
            <p style="color:#bdc3c7;">點擊小人即可查看該居民的即時座標與記憶。</p>
        </div>
    </div>

<script>
const canvas = document.getElementById('townMap');
const ctx = canvas.getContext('2d');
const sidebar = document.getElementById('sidebar');

const zones = [
    { name: "古寺", x: 40, y: 40, w: 150, h: 100, color: "#e74c3c" },
    { name: "嚮導工會", x: 260, y: 40, w: 180, h: 100, color: "#3498db" },
    { name: "藏醫診所", x: 500, y: 40, w: 150, h: 100, color: "#2ecc71" },
    { name: "雪豹茶館", x: 150, y: 220, w: 180, h: 120, color: "#f39c12" },
    { name: "高原牧場", x: 400, y: 220, w: 220, h: 150, color: "#27ae60" }
];

const names = ["巴桑", "央金", "索朗", "扎西", "艾米莉", "德吉", "嘎瑪", "次仁", "丹增", "尼瑪"];
const colors = ["#ff6b6b", "#4ecdc4", "#45b7d1", "#ffa07a", "#98d8c8", "#f7dc6f", "#bb8fce", "#85c1e2"];
const memories = [
    "早上與鎮民討論了雪崩預防措施。",
    "剛到茶館喝了一杯熱奶茶。",
    "正在準備今天的登山嚮導用品。",
    "在牧場幫忙照顧高原羊群。",
    "剛從古寺參拜完，準備回家。"
];
const activities = ["正在雪嶺鎮街道上巡視。", "正在前往茶館。", "正在協助居民搬運物資。", "正在記錄高原天氣。"];

const agents = [];
for (let i = 1; i <= 100; i++) {
    agents.push({
        id: i,
        name: names[i % names.length] + "·居民" + i,
        x: 50 + Math.random() * 600,
        y: 50 + Math.random() * 400,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        color: colors[i % colors.length],
        memory: memories[i % memories.length],
        activity: activities[i % activities.length]
    });
}

let selectedAgent = null;

function drawPixelAgent(a) {
    const x = Math.round(a.x);
    const y = Math.round(a.y);
    const selected = selectedAgent && selectedAgent.id === a.id;
    const px = 3;

    if (selected) {
        ctx.strokeStyle = "#f1c40f";
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 4 * px, y - 3 * px, 8 * px, 8 * px);
    }

    // 可愛像素小人：帽子、臉、身體、手和腳
    ctx.fillStyle = "#6c5ce7";
    ctx.fillRect(x - 2 * px, y - 4 * px, 4 * px, px);
    ctx.fillRect(x - 3 * px, y - 3 * px, 6 * px, px);
    ctx.fillStyle = "#ffd6a5";
    ctx.fillRect(x - 2 * px, y - 2 * px, 4 * px, 3 * px);
    ctx.fillStyle = "#222";
    ctx.fillRect(x - px, y - px, px, px);
    ctx.fillRect(x + px, y - px, px, px);
    ctx.fillStyle = a.color;
    ctx.fillRect(x - 2 * px, y + px, 4 * px, 3 * px);
    ctx.fillRect(x - 3 * px, y + px, px, 2 * px);
    ctx.fillRect(x + 2 * px, y + px, px, 2 * px);
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(x - 2 * px, y + 4 * px, px, 2 * px);
    ctx.fillRect(x + px, y + 4 * px, px, 2 * px);
}

function updateSidebar(a) {
    sidebar.innerHTML = `
        <h2>👤 ${a.name}</h2>
        <p><b>編號：</b>Agent #${a.id}</p>
        <div class="status-box">
            <p><b>📍 即時座標：</b></p>
            <p class="coordinate">X: ${a.x.toFixed(1)}　Y: ${a.y.toFixed(1)}</p>
            <p><b>🚶 目前動態：</b>${a.activity}</p>
            <p><b>🧠 最新記憶：</b>${a.memory}</p>
        </div>
        <p style="color:#bdc3c7;font-size:12px;">座標會隨人物移動即時更新。</p>
    `;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#d5e8d4";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    zones.forEach(z => {
        ctx.fillStyle = z.color;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(z.x, z.y, z.w, z.h);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = z.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(z.x, z.y, z.w, z.h);
        ctx.fillStyle = "#333";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(z.name, z.x + 10, z.y + 20);
    });

    agents.forEach(a => {
        a.x += a.vx;
        a.y += a.vy;
        if (a.x < 15 || a.x > canvas.width - 15) { a.vx *= -1; a.x = Math.max(15, Math.min(canvas.width - 15, a.x)); }
        if (a.y < 25 || a.y > canvas.height - 20) { a.vy *= -1; a.y = Math.max(25, Math.min(canvas.height - 20, a.y)); }
        drawPixelAgent(a);
    });

    if (selectedAgent) updateSidebar(selectedAgent);
}

// 動畫迴圈
setInterval(draw, 50);

canvas.addEventListener('click', event => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (event.clientX - rect.left) * scaleX;
    const my = (event.clientY - rect.top) * scaleY;

    // 找出點擊範圍內最近的小人，避免人物重疊時選錯居民
    selectedAgent = agents
        .map(a => ({ agent: a, distance: Math.hypot(a.x - mx, a.y - my) }))
        .filter(item => item.distance <= 22)
        .sort((a, b) => a.distance - b.distance)[0]?.agent || null;

    if (selectedAgent) updateSidebar(selectedAgent);
});

draw();
</script>
</body>
</html>
