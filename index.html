<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜馬拉雅山「雪嶺鎮」- 2D 動態小鎮模擬器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a2634; color: #ecf0f1; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 10px; }
        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; max-width: 1400px; margin: 0 auto; }
        .canvas-container { background: #2c3e50; border-radius: 8px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; position: relative; }
        canvas { border: 2px solid #34495e; border-radius: 4px; background: #cce7e8; cursor: pointer; }
        .sidebar { background: #243342; border-radius: 8px; padding: 15px; height: 600px; overflow-y: auto; }
        .tag { display: inline-block; background: #3498db; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
        .status-box { background: #1e2b37; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 4px solid #e74c3c; font-size: 13px; }
        .controls { margin-top: 10px; text-align: center; }
        button { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ecc71; }
    </style>
</head>
<body>

<div class="header">
    <h2>🏔️ 喜馬拉雅山「雪嶺鎮」- 2D 地圖與 100 位居民動態模擬器</h2>
    <p>模擬器時間：<span id="game-time" style="color:#f1c40f; font-weight:bold;">08:00 AM</span> | 點擊地圖上的居民可觀看即時動態</p>
</div>

<div class="main-layout">
    <!-- 左側：動態繪圖地圖 -->
    <div class="canvas-container">
        <canvas id="townMap" width="800" height="600"></canvas>
        <div class="controls">
            <button onclick="togglePause()">⏸️ 暫停 / 播放模擬</button>
        </div>
    </div>

    <!-- 右側：角色狀態與對話 Panel -->
    <div class="sidebar" id="sidebar">
        <h3>🔍 請點擊地圖上的角色小人查看動態</h3>
        <p style="color:#bdc3c7;">小鎮地圖包含：雪嶺古寺、嚮導工會、雪豹茶館、藏醫診所與高原牧場。</p>
    </div>
</div>

<script>
const canvas = document.getElementById('townMap');
const ctx = canvas.getContext('2d');

// 地圖場景區域設定
const zones = [
    { name: "古寺 (Monastery)", x: 50, y: 50, w: 180, h: 120, color: "#e74c3c" },
    { name: "嚮導工會 (Guild)", x: 300, y: 50, w: 200, h: 120, color: "#3498db" },
    { name: "藏醫診所 (Clinic)", x: 570, y: 50, w: 180, h: 120, color: "#2ecc71" },
    { name: "雪豹茶館 (Tea House)", x: 180, y: 250, w: 220, h: 150, color: "#f39c12" },
    { name: "高原牧場 (Pasture)", x: 480, y: 250, w: 270, h: 180, color: "#27ae60" },
    { name: "雪山隘口 (Pass)", x: 50, y: 450, w: 350, h: 120, color: "#95a5a6" }
];

// 生成 100 位動態角色
const agents = [];
const names = ["巴桑", "央金", "索朗", "扎西", "艾米莉", "德吉", "嘎瑪", "次仁", "丹增", "尼瑪", "普布", "白瑪", "卓瑪", "洛桑"];
const roles = ["嚮導", "藏醫", "織女", "客棧老闆", "畫師", "僧侶", "牧民", "研究員", "治安員"];

for (let i = 1; i <= 100; i++) {
    // 隨機初始位置，分佈在小鎮道路與建築附近
    const targetZone = zones[i % zones.length];
    agents.push({
        id: i,
        name: names[i % names.length] + "·" + (i <= 5 ? ["次仁","拉姆","巴桑","丹增","華森"][i-1] : "諾布"),
        role: roles[i % roles.length],
        x: targetZone.x + Math.random() * (targetZone.w - 20) + 10,
        y: targetZone.y + Math.random() * (targetZone.h - 20) + 10,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        color: `hsl(${(i * 37) % 360}, 70%, 60%)`,
        currentAction: "正在小鎮巡視與工作",
        targetZone: targetZone.name
    });
}

let selectedAgent = null;
let isPaused = false;
let gameMinutes = 480; // 從早上 8:00 開始

// 繪製喜馬拉雅山背景與建築物
function drawEnvironment() {
    // 雪山背景顏色
    ctx.fillStyle = "#d5e8d4";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 繪製道路
    ctx.strokeStyle = "#d0b585";
    ctx.lineWidth = 25;
    ctx.beginPath();
    ctx.moveTo(140, 110); ctx.lineTo(400, 110); ctx.lineTo(400, 325); ctx.lineTo(615, 325);
    ctx.moveTo(400, 325); ctx.lineTo(220, 510);
    ctx.stroke();

    // 繪製各個建築物區域
    zones.forEach(z => {
        ctx.fillStyle = z.color;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(z.x, z.y, z.w, z.h);
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = z.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(z.x, z.y, z.w, z.h);

        // 標籤名稱
        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText(z.name, z.x + 10, z.y + 20);
    });
}

// 繪製 100 位居民並更新位置
function drawAgents() {
    agents.forEach(a => {
        if (!isPaused) {
            // 人物移動邏輯
            a.x += a.vx;
            a.y += a.vy;

            // 撞牆反彈邊界
            if (a.x < 15 || a.x > canvas.width - 15) a.vx *= -1;
            if (a.y < 15 || a.y > canvas.height - 15) a.vy *= -1;

            // 偶爾隨機改變方向，模擬真實走動
            if (Math.random() < 0.02) {
                a.vx = (Math.random() - 0.5) * 1.5;
                a.vy = (Math.random() - 0.5) * 1.5;
            }
        }

        // 繪製角色像素圓圈
        ctx.beginPath();
        ctx.arc(a.x, a.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = a.color;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 如果被選中，繪製光圈標記
        if (selectedAgent && selectedAgent.id === a.id) {
            ctx.beginPath();
            ctx.arc(a.x, a.y, 11, 0, Math.PI * 2);
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    });
}

// 點擊地圖選擇角色
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // 尋找點擊到的最近 Agent
    let found = null;
    agents.forEach(a => {
        const dist = Math.hypot(a.x - mouseX, a.y - mouseY);
        if (dist < 12) found = a;
    });

    if (found) {
        selectedAgent = found;
        updateSidebar(found);
    }
});

// 更新右側面板
function updateSidebar(a) {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = `
        <h2>👤 ${a.name}</h2>
        <p><b>身分：</b><span class="tag">${a.role}</span> (居民 #${a.id})</p>
        <p><b>目前所在位置：</b>📍 ${a.targetZone}</p>
        <p><b>座標：</b>(X: ${Math.round(a.x)}, Y: ${Math.round(a.y)})</p>
        
        <div class="status-box">
            <h4>🔄 即時 Agent 行為 (Current Action)</h4>
            <p>「${a.name} ${a.currentAction}，正前往與附近的鎮民交流。」</p>
        </div>

        <div class="status-box" style="border-color:#3498db;">
            <h4>💬 Agent 記憶與記憶流 (Memory Stream)</h4>
            <ul>
                <li>記憶 1：早上 08:00 在 ${a.targetZone} 完成每日祈福。</li>
                <li>記憶 2：聽到關於雪崩預警與觀光季的討論。</li>
            </ul>
        </div>
    `;
}

// 模擬時間與動畫循環
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawEnvironment();
    drawAgents();

    if (!isPaused) {
        gameMinutes += 0.2;
        if (gameMinutes >= 1440) gameMinutes = 0; // 24小時循環
        const hrs = String(Math.floor(gameMinutes / 60)).padStart(2, '0');
        const mins = String(Math.floor(gameMinutes % 60)).padStart(2, '0');
        document.getElementById('game-time').innerText = `${hrs}:${mins}`;
    }

    requestAnimationFrame(loop);
}

function togglePause() {
    isPaused = !isPaused;
}

// 啟動動畫
loop();
</script>

</body>
</html>
